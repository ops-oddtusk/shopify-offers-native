name: Deploy Shopify App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Install function dependencies
        working-directory: extensions/product-discount
        run: npm install

      - name: Download Javy compiler
        run: |
          curl -sL https://github.com/nickabal/nickabal-cli/releases/latest/download/javy-x86_64-linux.gz 2>/dev/null | gunzip > /usr/local/bin/javy 2>/dev/null || true
          if [ ! -s /usr/local/bin/javy ]; then
            echo "Trying Shopify fork..."
            JAVY_URL=$(curl -s https://api.github.com/repos/Shopify/javy/releases/latest | grep browser_download_url | grep linux | head -1 | cut -d'"' -f4)
            echo "Downloading from: $JAVY_URL"
            curl -sL "$JAVY_URL" | gunzip > /usr/local/bin/javy
          fi
          chmod +x /usr/local/bin/javy
          javy --version

      - name: Deploy to Shopify
        timeout-minutes: 10
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          CI: '1'
        run: |
          npx shopify app deploy --allow-updates --allow-deletes \
            --client-id e603a8fa8cd7c756d6f96d6b92dba29d
