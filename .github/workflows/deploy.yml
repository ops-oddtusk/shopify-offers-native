name: Deploy Shopify App

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Javy CLI
        run: |
          curl -sSfL "https://github.com/bytecodealliance/javy/releases/download/v6.0.0/javy-x86_64-linux-v6.0.0.gz" -o javy.gz
          gunzip javy.gz
          chmod +x javy
          sudo mv javy /usr/local/bin/javy
          javy --version

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Install dependencies
        run: npm install

      - name: Deploy to Shopify
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
        run: |
          npx shopify app deploy --allow-updates --allow-deletes \
            --client-id e603a8fa8cd7c756d6f96d6b92dba29d
