name: Deploy Shopify App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Download Javy v3 compiler
        run: |
          curl -L -o javy.gz https://github.com/bytecodealliance/javy/releases/download/v3.1.0/javy-x86_64-linux-v3.1.0.gz || \
          curl -L -o javy.gz https://github.com/Shopify/javy/releases/download/v3.1.0/javy-x86_64-linux-v3.1.0.gz || \
          curl -L -o javy.gz https://github.com/bytecodealliance/javy/releases/download/v3.0.1/javy-x86_64-linux-v3.0.1.gz || \
          curl -L -o javy.gz https://github.com/bytecodealliance/javy/releases/download/v3.0.0/javy-x86_64-linux-v3.0.0.gz
          gunzip javy.gz
          chmod +x javy
          sudo mv javy /usr/local/bin/javy
          javy --version

      - name: Install function dependencies
        working-directory: extensions/product-discount
        run: npm install

      - name: Install UI extension dependencies
        working-directory: extensions/discount-settings
        run: npm install

      - name: Deploy to Shopify
        timeout-minutes: 10
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          CI: '1'
        run: |
          echo "Starting deploy at $(date)"
          npx shopify app deploy --allow-updates --allow-deletes \
            --client-id e603a8fa8cd7c756d6f96d6b92dba29d
          echo "Deploy completed at $(date)"
