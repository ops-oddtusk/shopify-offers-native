name: Deploy Shopify App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Install function dependencies
        working-directory: extensions/product-discount
        run: npm install

      - name: Verify Javy binary
        working-directory: extensions/product-discount
        run: npx javy --version || echo "javy not found"

      - name: Build function separately
        working-directory: extensions/product-discount
        timeout-minutes: 5
        run: |
          echo "Build started at $(date)"
          npm run build
          echo "Build done at $(date)"
          ls -la dist/

      - name: Deploy to Shopify
        timeout-minutes: 5
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          CI: '1'
        run: |
          echo "Deploy started at $(date)"
          npx shopify app deploy --allow-updates --allow-deletes \
            --client-id e603a8fa8cd7c756d6f96d6b92dba29d
          echo "Deploy done at $(date)"
