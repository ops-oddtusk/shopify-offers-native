api_version = "2025-07"
name = "Offer Product Discount"
type = "function"
handle = "offer-product-discount"

[build]
command = "javy emit-plugin -o plugin.wasm && javy build -C dynamic -C plugin=plugin.wasm -o dist/index.wasm src/run.js && rm -f plugin.wasm"
path = "dist/index.wasm"
watch = ["src/**/*.js"]

[[targeting]]
target = "purchase.product-discount.run"
input_query = "input-queries/run.graphql"
export = "run"

[ui]
enable_create = true
